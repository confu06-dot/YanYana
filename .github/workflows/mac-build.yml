name: Build YanYana for macOS

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    strategy:
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Show build files
        run: |
          echo "=== DIST ==="
          ls -lah dist
          echo "=== FILES ==="
          find dist -maxdepth 1 -type f -print

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: YanYana-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7